<!DOCTYPE html>
<html>
<head><title>Test localStorage</title></head>
<body>
<h1>LocalStorage Test for SLAG3D</h1>
<p><button id="testBtn">Test localStorage Write/Read</button></p>
<p><pre id="output">Click button to test...</pre></p>

<script>
document.getElementById('testBtn').onclick = () => {
  const key = 'slag3d_auth_token';
  try {
    localStorage.setItem(key, 'test-token-12345');
    const value = localStorage.getItem(key);
    
    let out = 'Write: SUCCESS\nRead: ' + (value || 'NULL') + '\n';
    
    // Try parsing stored user
    const userKey = 'slag3d_user';
    try {
      const userStr = localStorage.getItem(userKey);
      if(!userStr) {
        localStorage.setItem(userKey, JSON.stringify({username:'test',role:'admin'}));
      }
      out += 'User stored: ' + localStorage.getItem(userKey).slice(0, 50) + '...\n';
    } catch(e) {
      out += 'Error storing user: ' + e.message + '\n';
    }
    
    document.getElementById('output').textContent = out;
    out = 'Console.log output:\n';
    out += console.log ? 'Console is functional' : 'Console not available\n';
  } catch(e) {
    document.getElementById('output').textContent = 'Write FAILED: ' + e.message + '\n\nBrowser or extension may be blocking localStorage.';
  }
  
  // Show in console too
  if(console.log) console.log('[TEST] localStorage status:', out);
};
</script>
</body>
</html>
